name: CI

on:
  push:
    branches: [ main, master, develop, '*' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PDM
        run: pipx install pdm

      - name: Cache PDM
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdm
          key: ${{ runner.os }}-pdm-${{ hashFiles('**/pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pdm-

      - name: Install dependencies (dev)
        run: |
          pdm install -G dev

      - name: Lint
        run: pdm run lint

      - name: Format check
        run: pdm run format-check

      - name: Run tests
        run: pdm run pytest -q

